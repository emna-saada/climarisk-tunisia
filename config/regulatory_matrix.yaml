    date: "15 June 2022"
    url: "https://www.bis.org/bcbs/publ/d532.htm"
    status: "BIS page verified — principle numbering to be re-read in the PDF"
    requirement: "18 principles: 1–12 for banks (governance, internal control, capital and liquidity adequacy, credit and other risk management, scenario analysis), 13–18 for supervisors."
